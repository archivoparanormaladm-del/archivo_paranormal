<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil — Archivo Paranormal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* Modo y tema aplicados antes del primer pintado: evita el destello oscuro
   al navegar en modo claro. Debe ir ANTES de las hojas de estilo. */
(function(){try{
  var d=document.documentElement;
  d.setAttribute('data-modo', localStorage.getItem('modo')||'claro');
  var T={rojo:['#e63535','#c02020','#8a0f0f','#1c0808','rgba(230,53,53,.35)'],
    verde:['#22c55e','#16a34a','#14532d','#052e16','rgba(34,197,94,.35)'],
    azul:['#3b82f6','#2563eb','#1e3a8a','#0d1f4a','rgba(59,130,246,.35)'],
    morado:['#a855f7','#9333ea','#581c87','#2e0f4a','rgba(168,85,247,.35)'],
    naranja:['#f97316','#ea580c','#7c2d12','#3d1505','rgba(249,115,22,.35)'],
    cyan:['#06b6d4','#0891b2','#164e63','#042f3e','rgba(6,182,212,.35)'],
    rosa:['#ec4899','#db2777','#831843','#3d0a24','rgba(236,72,153,.35)'],
    amarillo:['#eab308','#ca8a04','#713f12','#2d1a03','rgba(234,179,8,.35)']};
  var t=T[localStorage.getItem('tema')];
  if(t){var k=['--red','--red-2','--red-dark','--red-bg','--red-glow'];
    for(var i=0;i<5;i++) d.style.setProperty(k[i],t[i]);}
}catch(e){}})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css?v=20260822q">
<link rel="stylesheet" href="carpeta.css?v=20260822q">
<link rel="stylesheet" href="feed.css?v=20260822q">
<link rel="stylesheet" href="perfil.css?v=20260822q">
</head>
<body>

<nav class="navbar">
  <a class="navbar-logo" onclick="irCarpetas()">
    <img src="/logoblack-nav.png" alt="Archivo Paranormal">
  </a>
  <div class="navbar-nav" id="navbar-nav"></div>
  <div class="navbar-session" id="session-bar"></div>
</nav>

<div class="perfil-layout">

  <!-- Tarjeta de perfil -->
  <div class="perfil-card">
    <div class="avatar-wrap" id="avatar-wrap" title="Cambiar foto de perfil">
      <img id="avatar-img" class="avatar-img hidden" alt="Foto de perfil">
      <div id="avatar-ph" class="avatar-ph">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      </div>
      <span class="avatar-cam">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </span>
      <input type="file" id="avatar-input" accept=".jpg,.jpeg,.png,.gif,.webp,.bmp" class="hidden">
    </div>
    <div class="perfil-datos">
      <p class="perfil-nombre" id="perfil-nombre">—</p>
      <p class="perfil-username" id="perfil-username">@—</p>
      <p class="perfil-email" id="perfil-email"></p>
      <div class="perfil-contadores" id="perfil-contadores">
        <span class="pc-item"><strong id="pc-pubs">0</strong> publicaciones</span>
        <button class="pc-item pc-btn" id="pc-btn-seg" type="button"><strong id="pc-seg">0</strong> seguidores</button>
        <button class="pc-item pc-btn" id="pc-btn-sig" type="button"><strong id="pc-sig">0</strong> siguiendo</button>
      </div>
    </div>
    <div class="perfil-acciones" id="perfil-acciones">
      <button class="btn-editar-perfil" id="btn-editar-perfil">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Editar perfil
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="perfil-tabs">
    <button class="perfil-tab active" data-tab="publicaciones">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Mis publicaciones
    </button>
    <button class="perfil-tab" data-tab="reposts">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      Reposteados
    </button>
    <button class="perfil-tab" data-tab="likes">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      Me gusta
    </button>
    <button class="perfil-tab" data-tab="guardados">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      Guardados
    </button>
  </div>

  <!-- Publicaciones -->
  <div id="tab-publicaciones" class="perfil-content">
    <p class="perfil-section-title" id="pub-section-title">MIS PUBLICACIONES</p>
    <div id="lista-publicaciones" class="pp-lista">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

  <!-- Reposteados -->
  <div id="tab-reposts" class="perfil-content hidden">
    <p class="perfil-section-title">PUBLICACIONES QUE REPOSTEÉ</p>
    <div id="lista-reposts" class="pp-lista">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

  <!-- Me gusta -->
  <div id="tab-likes" class="perfil-content hidden">
    <p class="perfil-section-title">PUBLICACIONES QUE ME GUSTAN</p>
    <div id="lista-likes" class="pp-lista">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

  <!-- Guardados -->
  <div id="tab-guardados" class="perfil-content hidden">
    <p class="perfil-section-title">ARCHIVOS GUARDADOS</p>
    <div id="lista-guardados" class="perfil-grid">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

</div>

<div class="vhs-overlay"></div>
<script src="temas.js?v=20260822q"></script>
<script src="auth.js?v=20260822q"></script>
<script src="perfil.js?v=20260822q"></script>
</body>
</html>
