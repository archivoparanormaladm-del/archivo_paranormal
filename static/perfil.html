<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil — Archivo Paranormal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="perfil.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-logo" onclick="irCarpetas()">
    <img src="/logo.png" alt="Archivo Paranormal">
  </a>
  <div class="navbar-nav" id="navbar-nav"></div>
  <div class="navbar-session" id="session-bar"></div>
</nav>

<div class="perfil-layout">

  <!-- Tarjeta de perfil -->
  <div class="perfil-card">
    <div class="avatar-wrap" id="avatar-wrap" title="Cambiar foto de perfil">
      <img id="avatar-img" class="avatar-img hidden" alt="Foto de perfil">
      <div id="avatar-ph" class="avatar-ph">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      </div>
      <span class="avatar-cam">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </span>
      <input type="file" id="avatar-input" accept=".jpg,.jpeg,.png,.gif,.webp,.bmp" class="hidden">
    </div>
    <div class="perfil-datos">
      <p class="perfil-nombre" id="perfil-nombre">—</p>
      <p class="perfil-username" id="perfil-username">@—</p>
      <p class="perfil-email" id="perfil-email"></p>
    </div>
    <button class="btn-editar-perfil" id="btn-editar-perfil">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Editar perfil
    </button>
  </div>

  <!-- Tabs -->
  <div class="perfil-tabs">
    <button class="perfil-tab active" data-tab="publicaciones">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Mis publicaciones
    </button>
    <button class="perfil-tab" data-tab="guardados">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      Guardados
    </button>
  </div>

  <!-- Publicaciones -->
  <div id="tab-publicaciones" class="perfil-content">
    <p class="perfil-section-title">MIS PUBLICACIONES</p>
    <div id="lista-publicaciones" class="perfil-grid">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

  <!-- Guardados -->
  <div id="tab-guardados" class="perfil-content hidden">
    <p class="perfil-section-title">ARCHIVOS GUARDADOS</p>
    <div id="lista-guardados" class="perfil-grid">
      <p class="cargando-txt">Cargando...</p>
    </div>
  </div>

</div>

<div class="vhs-overlay"></div>
<script src="temas.js"></script>
<script src="auth.js"></script>
<script src="perfil.js"></script>
</body>
</html>
