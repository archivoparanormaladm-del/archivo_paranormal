<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — Archivo Paranormal</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-logo">
  <img src="/logo.png" alt="Archivo Paranormal">
</div>

<div class="login-wrap">
  <p class="title">Recuperar contraseña</p>
  <p class="subtitle" style="text-align:center;color:var(--text-3);font-size:13px;margin-bottom:18px">
    Escribe tu correo y te enviaremos un enlace para restablecerla.
  </p>
  <form id="rec-form">
    <label>Correo</label>
    <input type="email" id="email" required autocomplete="email" placeholder="tu@correo.com">
    <div id="error-msg" class="error-msg hidden"></div>
    <div id="ok-msg" class="hidden" style="color:#4ade80;font-size:13px;margin:8px 0;text-align:center"></div>
    <button type="submit" class="btn-ingresar">Enviar enlace</button>
  </form>
  <p class="link-register"><a href="/index.html">← Volver a iniciar sesión</a></p>
</div>

<div class="vhs-overlay"></div>
<script src="temas.js"></script>
<script>
document.getElementById('rec-form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('error-msg');
  const okEl  = document.getElementById('ok-msg');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const res  = await fetch('/api/auth/recuperar', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await res.json();
    okEl.textContent = data.mensaje || 'Si el correo está registrado, te enviamos un enlace.';
    okEl.classList.remove('hidden');
    e.target.querySelector('input').value = '';
  } catch {
    errEl.textContent = 'Error de conexión.'; errEl.classList.remove('hidden');
  } finally { btn.disabled = false; btn.textContent = 'Enviar enlace'; }
});
</script>
</body>
</html>
